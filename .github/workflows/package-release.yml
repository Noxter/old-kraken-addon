name: Package OldKraken release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build installable ZIP
        run: |
          mkdir -p package/OldKraken
          cp OldKraken.toc Core.lua Communication.lua GuildRoster.lua package/OldKraken/
          cd package
          zip -r ../OldKraken.zip OldKraken

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" OldKraken.zip --clobber
