name: Package OldKraken release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/OldKraken

          mapfile -t addon_files < <(awk '
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*$/ { next }
            /\.lua[[:space:]]*$/ { print $1 }
          ' OldKraken.toc)

          if [ "${#addon_files[@]}" -eq 0 ]; then
            echo "No Lua files found in OldKraken.toc"
            exit 1
          fi

          for file in "${addon_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing file listed in OldKraken.toc: $file"
              exit 1
            fi
          done

          cp OldKraken.toc "${addon_files[@]}" package/OldKraken/
          test -f Media/OldKrakenKraken.tga || { echo "Missing addon emblem"; exit 1; }
          test -f Media/OldKrakenEmblem.tga || { echo "Missing saved alternate emblem"; exit 1; }
          mkdir -p package/OldKraken/Media
          cp Media/OldKrakenKraken.tga Media/OldKrakenEmblem.tga package/OldKraken/Media/
          cp Media/RoleSlot.tga Media/StatusOnline.tga Media/StatusOffline.tga package/OldKraken/Media/
          mkdir -p package/OldKraken/Media/Raids
          for raid in BarrowDeeps HyjalSummit Onyxia; do
            test -f "Media/Raids/$raid.tga" || { echo "Missing raid image: $raid"; exit 1; }
            cp "Media/Raids/$raid.tga" package/OldKraken/Media/Raids/
          done
          cp Media/Raids/CREDITS.txt package/OldKraken/Media/Raids/
          cd package
          zip -r ../OldKraken.zip OldKraken
          unzip -l ../OldKraken.zip

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" OldKraken.zip --clobber
