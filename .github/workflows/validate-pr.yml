name: Validate addon

on:
  pull_request:
  push:
    branches: [main, alpha]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua test runtime
        run: python -m pip install lupa==2.8
      - name: Check TOC references
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            test -f "$file" || { echo "Missing TOC file: $file"; exit 1; }
          done < <(awk '/^[[:space:]]*#/ { next } /^[[:space:]]*$/ { next } /\.lua[[:space:]]*$/ { print $1 }' OldKraken.toc)
      - name: Run Lua 5.1 checks
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do python "$test"; done
